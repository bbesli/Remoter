[package]
name = "remoter-vault"
description = "Encrypted vault: envelope cryptography, key slots, storage"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
remoter-core.workspace = true

argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
# Reading — never writing — the RFC 1421 enciphered PEM bodies that
# `ssh-keygen -m PEM` and `openssl rsa -aes256` produce; see `src/legacy_pem.rs`.
# All three are already in the workspace's dependency graph for `remoter-import`
# and `remoter-proto-rdp`, so this adds no crate and no licence question: they
# are RustCrypto, MIT OR Apache-2.0, both of which GPL-3.0 permits.
aes.workspace = true
cbc.workspace = true
md-5.workspace = true
# Trying a passphrase against a container the vault stores verbatim, so that a
# wrong one is refused at import rather than at connect time; see
# `src/openssh.rs` and `check_passphrase` in `src/pkcs8.rs`. Every one is
# RustCrypto, MIT OR Apache-2.0, and every one was already in the workspace's
# dependency graph — `pbkdf2`, `scrypt` and `ctr` through `remoter-import` and
# `russh`, `bcrypt-pbkdf` through `ssh-key`, which is the very reader whose
# verdict this has to agree with. No crate and no licence question is added.
ctr.workspace = true
pbkdf2.workspace = true
scrypt.workspace = true
bcrypt-pbkdf.workspace = true
blake3.workspace = true
zeroize.workspace = true
subtle.workspace = true
getrandom.workspace = true

rusqlite.workspace = true
serde.workspace = true
ciborium.workspace = true
uuid.workspace = true
data-encoding.workspace = true
unicode-normalization.workspace = true

keyring.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Lets `Vault::create` and `Vault::add_password_slot` accept
# `KdfParams::low_cost_for_tests` verbatim, below the cost floor.
#
# Enabled only through this crate's own dev-dependency on itself, below, so the
# test suite gets it and no ordinary build — `cargo build`, `cargo tauri dev`,
# or any downstream crate depending on remoter-vault — can turn it on. It must
# never appear in a dependency of a shipped binary.
insecure-test-kdf = []

# Compiles the container builders in `src/testing.rs`, which this crate's
# integration tests read: an encrypted OpenSSH key has to be a real one now that
# the vault tries the passphrase against it, and an integration test lives
# outside the crate and cannot see a `#[cfg(test)]` fixture. Turned on the same
# way, and for the same reason — through the dev-dependency below and nowhere
# else, so no shipped build carries it.
test-fixtures = []

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
# Self-dependency: the only way to enable a feature for this crate's own tests
# without also enabling it for its ordinary builds. Feature resolution keeps
# dev-dependency features out of a plain `cargo build`.
remoter-vault = { path = ".", features = ["insecure-test-kdf", "test-fixtures"] }

[lints]
workspace = true
