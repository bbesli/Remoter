[package]
name = "remoter-proto-rdp"
description = "RDP sessions"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# `tests/live_server.rs`, which needs a real RDP host: a Windows Server, or the
# `xrdp` fixture from `docs/development/getting-started.md`. The host and the
# credentials come from the environment; see that file's header.
integration-tests = []

[dependencies]
remoter-core.workspace = true
remoter-proto = { path = "../remoter-proto", version = "0.1.0" }

# IronRDP 0.17, the version CLAUDE.md §8 pins. MIT OR Apache-2.0, both
# GPL-3.0 compatible; recorded in `deny.toml`.
#
# The meta crate re-exports the workspace crates behind features, so the
# feature list *is* the dependency list:
#
#   session         the active stage: fast-path updates and input
#   graphics        the bitmap and codec decoders (MS-RDPEGDI, MS-RDPRFX)
#   pdu, core       the wire types everything above is written in
#   svc             static virtual channels (MS-RDPBCGR §1.3.3)
#   input           scancode and pointer encoding (MS-RDPBCGR §2.2.8.1)
#   cliprdr         the clipboard channel (MS-RDPECLIP)
#   dvc             dynamic virtual channels (MS-RDPEDYC)
#   displaycontrol  dynamic desktop resize (MS-RDPEDISP), which is what
#                   `docs/architecture/rendering.md` calls "smart resize"
#
# ---------------------------------------------------------------------------
# `connector` and `ironrdp-async` are MISSING, and their absence is a blocker,
# not an oversight. Read this before adding either back.
#
# `ironrdp-connector` 0.10 — the state machine for the connection sequence of
# MS-RDPBCGR §1.3.1.1, and the crate `ironrdp-async` is built on — depends on
# `picky =7.0.0-rc.25`, whose default features activate `aes-gcm =0.11.0-rc.4`.
# `remoter-import` depends on `aes-gcm ^0.11`, which resolves to 0.11.1.
# Both are inside the 0.11 compatibility range, so cargo will not carry the
# two together:
#
#   error: failed to select a version for `aes-gcm`.
#       ... required by package `remoter-import`
#     previously selected package `aes-gcm v0.11.0-rc.4`
#       ... of package `picky v7.0.0-rc.25`
#       ... of package `ironrdp-connector v0.10.0`
#
# Adding `connector` therefore does not fail this crate — it fails EVERY cargo
# command in the repository, which is precisely the state the workspace must
# never be left in. An optional feature does not help: cargo resolves optional
# dependencies whether or not they are activated.
#
# The three ways out, worst last:
#
#   1. Wait for `ironrdp-connector` to move to a picky release that depends on
#      a released `aes-gcm`. Costs nothing and blocks the RDP milestone.
#   2. Pin `remoter-import` to `aes-gcm =0.11.0-rc.4`. One line, and it works
#      — but it puts a release candidate of a cryptographic crate in the path
#      that parses hostile mRemoteNG files, which is the one place in the
#      product where an importer bug is an attacker's bug. That is a decision
#      for the maintainer under CLAUDE.md §8, with the justification recorded,
#      not something to slip into an RDP commit.
#   3. Drop `aes-gcm` from `remoter-import`, which means dropping GCM-mode
#      `confCons.xml` import. It is a real format that real users have.
#
# Until one of those happens, everything below the connection sequence — the
# decoders, the input encoders, the clipboard channel, the framebuffer
# plumbing — can be written and unit-tested against captured PDUs, which is
# most of the work and all of the parsing.
# ---------------------------------------------------------------------------
ironrdp = { version = "0.17", features = [
    "session",
    "graphics",
    "pdu",
    "core",
    "svc",
    "input",
    "cliprdr",
    "dvc",
    "displaycontrol",
] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
# The Mozilla root store, already in the workspace tree for the update check.
# CDLA-Permissive-2.0, recorded in `deny.toml`.
webpki-roots = "1"
parking_lot.workspace = true
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
# NTLM is defined in terms of these and nothing stronger; see
# `src/credssp/ntlm.rs` for why substituting is not an option. All three are
# RustCrypto crates already in the workspace tree, so nothing new is
# introduced into the dependency graph by naming them here.
hmac = "0.13"
md-5.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
async-trait = "0.1"
bytes = "1"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
    "io-util",
] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

# Reading the user's configured keyboard layout out of
# `HKCU\Keyboard Layout\Preload` — see `src/layout.rs` for why the default
# cannot be a constant. MIT, and already in this workspace's dependency graph
# (tauri-build -> embed-resource), so it adds no crate and no licence to
# review; recorded in `deny.toml` all the same. The alternative is
# `GetKeyboardLayoutNameW`, which is FFI, and this workspace sets
# `unsafe_code = "forbid"`.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
# `test-util` is what `#[tokio::test(start_paused = true)]` needs. One test
# asserts how long a closing tab waits for a deactivation-reactivation
# sequence; measured against a paused clock it is instant and deterministic,
# and against a real one it would either take seconds or assert nothing.
tokio = { workspace = true, features = ["full", "test-util"] }
parking_lot.workspace = true

[lints]
workspace = true
